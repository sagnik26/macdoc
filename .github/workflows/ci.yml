name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # golangci-lint compares against origin/main (issues.new-from-rev).
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15

      - name: Test
        run: make test

      # Invariant 3: internal/mcp and internal/engine never reach the executor.
      - name: Import guard
        run: make importcheck

      # Invariants 2 and 8: no deletes, renames or exec outside internal/executor.
      - name: Forbidden-call guard
        run: make forbidcheck

      # Every test the threat model names must still exist.
      - name: Threat-model guard
        run: make threatcheck

      # Known vulnerabilities in the code paths and dependencies we use.
      - name: Vulnerability scan
        run: make vulncheck

      - name: Build
        run: make build

      - name: Fuzz (short)
        run: |
          go test -run='^$' -fuzz=FuzzCanonicalize -fuzztime=10s ./internal/safety
          go test -run='^$' -fuzz=FuzzCheckTarget -fuzztime=10s ./internal/safety
          go test -run='^$' -fuzz=FuzzFoldIsIdempotent -fuzztime=10s ./internal/pathfold/tests
