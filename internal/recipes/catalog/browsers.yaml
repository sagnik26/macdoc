# Web browser caches. Caches only: profiles, history, cookies, bookmarks and
# saved passwords live under Application Support and are never listed here.
# Schema: internal/recipes/recipe.go.

- id: browser.safari
  title: Safari cache
  category: app-caches
  toolchain: system
  risk: SAFE
  regenerable: true
  method: quarantine
  detector: path
  params: {path: "~/Library/Caches/com.apple.Safari"}
  allow: ["~/Library/Caches/com.apple.Safari"]
  preconditions: ["app_not_running:Safari"]
  restore:
    kind: redownload
    note: Safari downloads pages and images again as you browse; pages may load slower at first.
  explain: >-
    Safari keeps copies of pages, images and scripts here so sites load faster. Quit Safari first. Your bookmarks, history, passwords, cookies and open tabs are stored elsewhere and are not touched.

