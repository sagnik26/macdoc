# Spotify keeps its cache in Application Support, and the same folder can hold
# songs you saved for offline listening, so this one is CAUTION, not SAFE.
- id: spotify.cache
  title: Spotify cache and offline downloads
  category: app-caches
  toolchain: system
  risk: CAUTION
  method: quarantine
  detector: path
  params: {path: "~/Library/Application Support/Spotify/PersistentCache"}
  allow: ["~/Library/Application Support/Spotify/PersistentCache"]
  preconditions: ["app_not_running:Spotify"]
  restore:
    kind: redownload
    note: Spotify rebuilds its cache as you listen. Songs you saved for offline listening are downloaded again when you turn the download on.
  explain: >-
    Spotify keeps streamed songs, album art and other cached data here. Quit Spotify first. The same folder can hold songs you saved for offline listening, so you may need to download them again. Your account, playlists and settings are stored elsewhere and are not touched.
