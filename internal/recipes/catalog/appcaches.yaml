# Caches of desktop apps built on Chromium (Electron): web content, compiled
# code and graphics shaders the app rebuilds. Only the cache folders under the
# app's Application Support folder are listed; settings, logins, messages,
# notes, vaults and downloads are stored elsewhere and are never matched.
# Schema: internal/recipes/recipe.go.

- id: slack.cache
  title: Slack cache
  category: app-caches
  toolchain: system
  risk: SAFE
  regenerable: true
  method: quarantine
  detector: paths
  params: {paths: "~/Library/Application Support/Slack/Cache,~/Library/Application Support/Slack/Code Cache,~/Library/Application Support/Slack/GPUCache,~/Library/Application Support/Slack/DawnCache,~/Library/Application Support/Slack/DawnGraphiteCache,~/Library/Application Support/Slack/DawnWebGPUCache"}
  allow: ["~/Library/Application Support/Slack/Cache", "~/Library/Application Support/Slack/Code Cache", "~/Library/Application Support/Slack/GPUCache", "~/Library/Application Support/Slack/DawnCache", "~/Library/Application Support/Slack/DawnGraphiteCache", "~/Library/Application Support/Slack/DawnWebGPUCache"]
  preconditions: ["app_not_running:Slack"]
  restore:
    kind: rebuild
    note: Slack rebuilds these caches as you use it; it may start a little slower.
  explain: >-
    Slack keeps caches of web content, compiled code and graphics here. Quit Slack first. Your account, settings, messages and files are stored elsewhere and are not touched.

