# General system locations (docs/RECIPE_CATALOG.md §2). swap.explain and
# crawl.unknown_large are not in this phase.

- id: user.app_caches
  title: App cache
  category: app-caches
  toolchain: system
  risk: CAUTION
  method: quarantine
  detector: app_caches
  # exclude: children of ~/Library/Caches owned by other recipes, and folders a
  # tool runs from (Playwright, Cypress, Puppeteer and Camoufox keep their
  # downloaded browsers there; removing them breaks the tool).
  params:
    dir: "~/Library/Caches"
    min_bytes: "52428800"
    # Google and JetBrains: Android Studio's caches are their own recipe, and
    # JetBrains IDEs keep Local History (unrecoverable) under Caches.
    exclude: "com.apple.dt.Xcode,CocoaPods,Yarn,pip,pypoetry,Homebrew,Google,JetBrains,go-build,deno,composer,org.swift.swiftpm,node-gyp,Microsoft Edge,BraveSoftware,company.thebrowser.Browser,Firefox,zig,ms-playwright,ms-playwright-go,ms-playwright-mcp,Cypress,puppeteer,camoufox"
  allow: ["~/Library/Caches/*"]
  keep_children_of: ["~/Library/Caches"]
  stale_days: 14
  restore:
    kind: rebuild
    note: The app recreates its cache as you use it.
  explain: >-
    Apps keep caches to load faster, and they recreate them when they're
    missing. Quit the app before cleaning its cache; it may be slower the
    first time you open it again. Apple's own caches aren't included.

- id: user.logs
  title: Old app logs
  category: logs
  toolchain: system
  risk: SAFE
  method: quarantine
  detector: children
  # Google and JetBrains: Android Studio's logs are their own recipe.
  params: {dir: "~/Library/Logs", exclude: "Google,JetBrains"}
  allow: ["~/Library/Logs/*"]
  keep_children_of: ["~/Library/Logs"]
  stale_days: 30
  restore:
    kind: none
    note: Old logs aren't needed for apps to work.
  explain: >-
    Apps write diagnostic logs here. Logs that haven't changed in a month are
    rarely needed. Apps start new logs as they need them.

- id: user.trash
  title: Trash
  category: system
  toolchain: system
  risk: CAUTION
  method: quarantine
  detector: children
  # Each item in the Trash that the scan keeps (100 MB or more) is its own
  # suggestion. Smaller items stay; Finder's Empty Trash removes everything.
  # This is the one irreplaceable recipe the loader accepts as cleanable: see
  # quarantinedTrash in internal/recipes/load.go.
  params: {dir: "~/.Trash", min_bytes: "1"}
  allow: ["~/.Trash/*"]
  restore:
    kind: irreplaceable
    note: Moved aside into macdoc's quarantine first, so you can restore it until the quarantine expires; after that it is gone.
  explain: >-
    Files you move to the Trash still use disk space until the Trash is
    emptied. macdoc moves what you choose into its own quarantine instead of
    deleting it at once, so a mistake can be undone for a while. Look through
    the Trash first: anything you might still need should be put back.

- id: user.downloads_large_old
  title: Old installer or archive
  category: downloads
  toolchain: system
  risk: CAUTION
  method: quarantine
  detector: downloads_large_old
  # Installers and archives (.dmg, .pkg, .zip, .xip, .iso, .ipa, …). Disk
  # images, packages and ISOs are kept by the scanner at any size so small
  # ones are seen; archives are seen from 100 MB, the scanner's threshold.
  params: {dir: "~/Downloads", min_bytes: "20971520", files: installers}
  allow: ["~/Downloads/*"]
  keep_files:
    - "~/Downloads/*.dmg"
    - "~/Downloads/*.pkg"
    - "~/Downloads/*.mpkg"
    - "~/Downloads/*.iso"
    - "~/Downloads/*.xip"
  stale_days: 30
  restore:
    kind: redownload
    note: >-
      Re-download from the original source, if it's still available. Other
      downloads aren't included, because they may be the only copy.
  explain: >-
    Installers, disk images and archives in Downloads often stay after
    they've been used. This one hasn't changed in a month or more. Check that
    you don't need it, or can download it again, before cleaning.

- id: user.downloads_large_other
  title: Large old download
  category: downloads
  toolchain: system
  risk: ADVISE
  method: advise
  detector: downloads_large_old
  # Everything that isn't an installer or archive: videos, AirDrop and phone
  # imports may be the only copy, so macdoc only points at them.
  params: {dir: "~/Downloads", min_bytes: "524288000", files: other}
  stale_days: 90
  restore:
    kind: irreplaceable
    note: This file may be the only copy. Check before you remove it.
  explain: >-
    This large file in Downloads hasn't changed in months. It isn't an
    installer or archive, so it may be the only copy (for example a video
    from AirDrop or a phone). Review it in Finder and move or delete it
    yourself if you don't need it.
  steps:
    - "Open it in Finder: `open -R` followed by the path shown above."
    - "If you need it, move it to an external disk or cloud storage; if not, move it to the Trash."
    - "Empty the Trash, then press r in macdoc to rescan."

- id: ios.device_backups
  title: iPhone or iPad backup
  category: backups
  toolchain: system
  risk: ADVISE
  method: advise
  detector: children
  params: {dir: "~/Library/Application Support/MobileSync/Backup"}
  keep_children_of: ["~/Library/Application Support/MobileSync/Backup"]
  restore:
    kind: irreplaceable
    note: A backup may be the only copy of a device's data.
  explain: >-
    Finder stores local backups of your iPhone and iPad here. macdoc doesn't
    remove backups. Review them in Finder: select the device, then Manage
    Backups.
  steps:
    - "Connect the iPhone or iPad, open Finder and select it in the sidebar."
    - "Click Manage Backups, select backups you no longer need and click Delete Backup."
    - "Press r in macdoc to rescan."

- id: tm.local_snapshots
  title: Time Machine local snapshots
  category: backups
  toolchain: system
  risk: ADVISE
  method: advise
  detector: local_snapshots
  restore:
    kind: irreplaceable
    note: Local snapshots are backups.
  explain: >-
    Time Machine keeps local snapshots on this disk between backups. They are
    backups, and macOS thins them automatically when space runs low.
    tmutil listlocalsnapshots / lists them.
  confidence_notes: macOS doesn't report how much space each snapshot uses.
  steps:
    - "Usually nothing: macOS removes them on its own when space runs low."
    - "To see them: `tmutil listlocalsnapshots /`"
    - "To free the space now, run a Time Machine backup; older local snapshots are thinned afterwards."


- id: tm.incomplete_backups
  title: Incomplete Time Machine backup
  category: backups
  toolchain: system
  risk: ADVISE
  method: advise
  detector: incomplete_backups
  restore:
    kind: irreplaceable
    note: An interrupted backup is not a usable backup.
  explain: >-
    When a Time Machine backup is interrupted, it can leave a folder ending in
    .inProgress on the backup disk. macdoc found one. Time Machine usually
    reuses or removes it after the next successful backup. Removing one by hand
    needs administrator rights, so macdoc only tells you about it.
  confidence_notes: Time Machine doesn't report how much space an interrupted backup uses.
  steps:
    - "Usually nothing: let Time Machine finish a full backup; it cleans up interrupted ones itself."
    - "To see them: open the backup disk in Finder, then Backups.backupdb and your Mac's folder; interrupted backups end in .inProgress."
    - "To delete one now, use Time Machine's own tools (tmutil delete needs administrator rights, so run it yourself in Terminal)."

- id: user.crash_reporter
  title: Old crash reporter files
  category: logs
  toolchain: system
  risk: SAFE
  regenerable: true
  method: quarantine
  detector: downloads_large_old
  # Reuses the old-files detector: files directly in the folder that haven't
  # changed for 30 days. The scan keeps the .plist files at any size.
  params: {dir: "~/Library/Application Support/CrashReporter", min_bytes: "1", files: other}
  allow: ["~/Library/Application Support/CrashReporter/*"]
  keep_files: ["~/Library/Application Support/CrashReporter/*.plist"]
  stale_days: 30
  restore:
    kind: rebuild
    note: macOS writes these small files again the next time an app crashes.
  explain: >-
    macOS keeps a small record per app in this folder to decide when to offer
    to send a crash report. Ones that haven't changed in a month are not
    needed; macOS recreates them when it needs them. They are tiny, so this
    frees very little.
