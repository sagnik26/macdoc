# Node package managers and project dependencies (docs/RECIPE_CATALOG.md §2).
# rn.metro_cache is not here: it lives in $TMPDIR (/private/var/folders),
# which is protected and outside home. The project recipes (project_artifact
# detector) use internal/projects: a project's idle time is its last git
# commit, source change or build, and git state raises the risk.

- id: node.node_modules_stale
  title: Stale node_modules folder
  category: build-artifacts
  toolchain: node
  risk: CAUTION
  method: quarantine
  detector: node_modules_stale
  params: {min_bytes: "50000000"}
  allow: ["~/*/**/node_modules"]
  keep_names: [node_modules]
  stale_days: 90
  restore:
    kind: redownload
    note: Run npm i, pnpm i or yarn in the project.
  explain: >-
    node_modules holds a project's installed JavaScript dependencies. This
    project's dependencies haven't changed in a while. Moving the folder
    keeps the project itself intact; reinstalling with npm i, pnpm i or yarn
    brings it back.
  confidence_notes: >-
    Only folders next to a package.json and a lockfile are reported; global
    and tool installs aren't. Idle time is the newest modification time of the
    folder, package.json and the lockfile. A later project scan will refine
    this with git history.

- id: npm.cache
  title: npm cache
  category: package-caches
  match: ["npm:npm"]
  risk: SAFE
  method: native
  detector: path
  params: {path: "~/.npm/_cacache"}
  native:
    argv: [npm, cache, clean, --force]
  restore:
    kind: redownload
    note: npm downloads packages again on the next install.
  explain: >-
    npm keeps a copy of every package it has downloaded so later installs are
    faster. Clearing it doesn't affect installed projects. If npm is a
    Corepack shim, running the command may download the package manager
    first.

- id: pnpm.store
  title: pnpm content store
  category: package-caches
  match: ["npm:pnpm"]
  risk: SAFE
  method: native
  detector: path
  params: {path: "~/Library/pnpm/store", size: unknown}
  native:
    argv: [pnpm, store, prune]
  restore:
    kind: redownload
    note: pnpm downloads removed packages again when a project needs them.
  explain: >-
    pnpm stores every package once and links it into projects. Pruning
    removes only packages that no project references any more. If pnpm is a
    Corepack shim, running the command may download the package manager
    first.
  confidence_notes: >-
    How much pruning frees isn't known in advance: only packages no project
    references are removed, so the size is shown as unknown rather than the
    whole store.

- id: yarn.cache
  title: Yarn cache
  category: package-caches
  match: ["npm:yarn"]
  risk: SAFE
  method: native
  detector: path
  params: {path: "~/Library/Caches/Yarn"}
  native:
    argv: [yarn, cache, clean]
  restore:
    kind: redownload
    note: Yarn downloads packages again on the next install.
  explain: >-
    Yarn classic keeps downloaded packages here to speed up installs.
    Clearing it doesn't affect installed projects. If yarn is a Corepack
    shim, running the command may download the package manager first.

- id: nvm.old_versions
  title: Older Node.js version installed by nvm
  category: package-caches
  match: ["brew:nvm"]
  risk: CAUTION
  method: quarantine
  detector: nvm_old_versions
  params: {dir: "~/.nvm/versions/node", alias: "~/.nvm/alias"}
  allow: ["~/.nvm/versions/node/*"]
  keep_children_of: ["~/.nvm/versions/node"]
  restore:
    kind: redownload
    note: Run nvm install <version> to get it back.
  explain: >-
    nvm keeps every Node.js version you have installed. This one is neither
    your default nor the newest. Projects pinned to it with .nvmrc will need
    it installed again with nvm install.
  confidence_notes: >-
    .nvmrc files in projects aren't checked yet; that comes with the project
    scan.

- id: rn.ios_pods_stale
  title: CocoaPods folder in an idle project
  category: build-artifacts
  toolchain: cocoapods
  risk: CAUTION
  method: quarantine
  detector: project_artifact
  # Pods can hold local edits, so uncommitted changes make it RISKY.
  params: {artifacts: "ios/Pods,Pods", min_bytes: "10000000", dirty_risk: RISKY}
  allow: ["~/*/**/ios/Pods", "~/*/**/Pods"]
  stale_days: 90
  preconditions: ["git_clean", "app_not_running:Xcode"]
  restore:
    kind: redownload
    note: Run pod install in the project's ios folder (or next to the Podfile).
  explain: >-
    The Pods folder holds the CocoaPods libraries an iOS project uses,
    installed from its Podfile and Podfile.lock. This project hasn't been
    worked on in a while. Moving the folder leaves the project itself intact;
    pod install brings the same versions back from Podfile.lock.
  confidence_notes: >-
    Only Pods folders next to a Podfile are reported. If your team commits
    Pods to git, moving it shows up as deleted files until you restore it.

- id: rn.native_build_stale
  title: Native build folder in an idle project
  category: build-artifacts
  toolchain: react-native
  risk: SAFE
  method: quarantine
  detector: project_artifact
  params:
    artifacts: "ios/build,android/build,android/app/build,android/.gradle"
    min_bytes: "10000000"
    dirty_risk: CAUTION
  allow: ["~/*/**/ios/build", "~/*/**/android/build", "~/*/**/android/app/build", "~/*/**/android/.gradle"]
  stale_days: 90
  preconditions: ["gradle_daemons_stopped", "app_not_running:Xcode"]
  restore:
    kind: rebuild
    note: The next iOS or Android build recreates it, which takes longer than usual once.
  explain: >-
    These folders hold compiled output from iOS and Android builds of a React
    Native or native project: object files, intermediate builds and Gradle's
    per-project state. They are recreated on the next build.
  confidence_notes: >-
    Only ios/build next to a Podfile or Xcode project, and android/ folders
    with Gradle build files, are reported.

- id: node.next_cache_stale
  title: Next.js build folder in an idle project
  category: build-artifacts
  toolchain: node
  risk: SAFE
  method: quarantine
  detector: project_artifact
  params: {artifacts: ".next", min_bytes: "10000000", dirty_risk: CAUTION}
  allow: ["~/*/**/.next"]
  stale_days: 90
  restore:
    kind: rebuild
    note: next build or next dev recreates it.
  explain: >-
    .next holds Next.js build output and its build cache. Nothing in it is
    source code; the next build or dev server run recreates it.
  confidence_notes: >-
    Only .next folders next to a package.json are reported.
