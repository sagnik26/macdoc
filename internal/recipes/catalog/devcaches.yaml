- id: vscode.cache
  title: VS Code cache
  category: app-caches
  toolchain: system
  risk: SAFE
  regenerable: true
  method: quarantine
  detector: paths
  params: {paths: "~/Library/Application Support/Code/Cache,~/Library/Application Support/Code/CachedData,~/Library/Application Support/Code/Code Cache,~/Library/Application Support/Code/GPUCache,~/Library/Application Support/Code/DawnCache,~/Library/Application Support/Code/DawnGraphiteCache,~/Library/Application Support/Code/DawnWebGPUCache"}
  allow: ["~/Library/Application Support/Code/Cache", "~/Library/Application Support/Code/CachedData", "~/Library/Application Support/Code/Code Cache", "~/Library/Application Support/Code/GPUCache", "~/Library/Application Support/Code/DawnCache", "~/Library/Application Support/Code/DawnGraphiteCache", "~/Library/Application Support/Code/DawnWebGPUCache"]
  preconditions: ["app_not_running:Visual Studio Code"]
  restore:
    kind: rebuild
    note: Visual Studio Code rebuilds these caches as you use it.
  explain: >-
    Visual Studio Code keeps caches of web content, compiled code and graphics here. Quit it first. Settings, extensions, workspaces and unsaved work are stored elsewhere and are not touched.

