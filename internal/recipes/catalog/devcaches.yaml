- id: jetbrains.logs
  title: Old JetBrains IDE logs
  category: logs
  toolchain: system
  risk: SAFE
  method: quarantine
  detector: children
  params: {dir: "~/Library/Logs/JetBrains"}
  allow: ["~/Library/Logs/JetBrains/*"]
  keep_children_of: ["~/Library/Logs/JetBrains"]
  stale_days: 30
  restore:
    kind: none
    note: Old logs aren't needed; the IDE writes new ones.
  explain: >-
    JetBrains IDEs write a log folder for each IDE version. Folders that haven't changed in a month are rarely needed. Only logs are listed; Local History, which lives under Caches, is never touched.

