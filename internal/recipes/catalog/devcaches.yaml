# Caches of developer tools and editors that rebuild or download again.
# Schema: internal/recipes/recipe.go.

- id: go.build_cache
  title: Go build cache
  category: build-artifacts
  toolchain: system
  risk: SAFE
  regenerable: true
  method: quarantine
  detector: path
  params: {path: "~/Library/Caches/go-build"}
  allow: ["~/Library/Caches/go-build"]
  restore:
    kind: rebuild
    note: Go rebuilds packages on the next build, which is slower the first time.
  explain: >-
    Go keeps compiled packages here to speed up builds. It recompiles whatever is missing.

- id: cargo.registry_cache
  title: Cargo registry cache
  category: package-caches
  toolchain: system
  risk: SAFE
  regenerable: true
  method: quarantine
  detector: path
  params: {path: "~/.cargo/registry/cache"}
  allow: ["~/.cargo/registry/cache"]
  restore:
    kind: redownload
    note: Cargo downloads the crate files again when a build needs them.
  explain: >-
    Cargo keeps the downloaded .crate files here. It fetches them again from the registry when a build needs them. Your installed tools and source checkouts are not in this folder.

