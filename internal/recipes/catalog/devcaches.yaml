- id: ios.firmware_cache
  title: Cached iPhone and iPad restore files
  category: app-caches
  toolchain: system
  risk: SAFE
  regenerable: true
  method: quarantine
  detector: paths
  params: {paths: "~/Library/iTunes/iPhone Software Updates,~/Library/iTunes/iPad Software Updates,~/Library/iTunes/iPod Software Updates,~/Library/iTunes/Apple TV Software Updates"}
  allow: ["~/Library/iTunes/iPhone Software Updates", "~/Library/iTunes/iPad Software Updates", "~/Library/iTunes/iPod Software Updates", "~/Library/iTunes/Apple TV Software Updates"]
  restore:
    kind: redownload
    note: Finder downloads the restore file again the next time you restore or update that device.
  explain: >-
    Finder keeps the iOS and iPadOS restore files (.ipsw) it downloaded here. They are large and can be downloaded again. Your device backups are in a different folder (see the device backups suggestion) and are not touched.
