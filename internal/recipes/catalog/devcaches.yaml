- id: precommit.cache
  title: pre-commit cache
  category: package-caches
  toolchain: system
  risk: SAFE
  regenerable: true
  method: quarantine
  detector: path
  params: {path: "~/.cache/pre-commit"}
  allow: ["~/.cache/pre-commit"]
  restore:
    kind: rebuild
    note: pre-commit sets up its hook environments again on the next run, which takes a while.
  explain: >-
    pre-commit keeps a clone and environment for each hook here. It builds them again the next time hooks run.

- id: vscode.cache
  title: VS Code cache
  category: app-caches
  toolchain: system
  risk: SAFE
  regenerable: true
  method: quarantine
  detector: paths
  params: {paths: "~/Library/Application Support/Code/Cache,~/Library/Application Support/Code/CachedData,~/Library/Application Support/Code/Code Cache,~/Library/Application Support/Code/GPUCache"}
  allow: ["~/Library/Application Support/Code/Cache", "~/Library/Application Support/Code/CachedData", "~/Library/Application Support/Code/Code Cache", "~/Library/Application Support/Code/GPUCache"]
  preconditions: ["app_not_running:Visual Studio Code"]
  restore:
    kind: rebuild
    note: Visual Studio Code rebuilds these caches as you use it.
  explain: >-
    Visual Studio Code keeps caches of web content, compiled code and graphics here. Quit it first. Settings, extensions, workspaces and unsaved work are stored elsewhere and are not touched.

