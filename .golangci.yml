version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - gosec
    - misspell
    - errorlint
    - gocritic
    - unconvert
    - nolintlint
    - revive
    - gocognit
    - gocyclo
  settings:
    revive:
      # Google Go style (https://google.github.io/styleguide/go/decisions).
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: unexported-return
        - name: error-strings
        - name: context-as-argument
        - name: indent-error-flow
    # Gates for new code. The backlog is cleared hotspot by hotspot; see
    # issues.new-from-rev below.
    gocognit:
      min-complexity: 25
    gocyclo:
      min-complexity: 15
    misspell:
      locale: US
    nolintlint:
      # Every //nolint must name the linter and say why, and must still be
      # needed.
      require-specific: true
      require-explanation: true
      allow-unused: false
  exclusions:
    # No default presets: the "comments" preset would silence the doc-comment
    # rule that the Google style guide requires.
    presets: []
    rules:
      # Tests and test helpers build fixtures under t.TempDir() and run
      # fixed tools (bash for the guard-script tests): variable file paths
      # (G304), default 0o755/0o644 permissions (G301, G306) and exec with
      # a looked-up binary (G204) are intended there. Production code keeps
      # all of these checks.
      - path: (_test\.go$|^internal/testutil/)
        linters: [gosec]
        text: "^G(204|301|304|306):"

issues:
  # Style and complexity findings in code that already existed are fixed over
  # time; only lines changed since main are gated. Drop this once the backlog
  # is cleared.
  new-from-rev: origin/main

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      # Standard library, then other modules, then this module (Google Go
      # style: group imports).
      local-prefixes:
        - github.com/sagnik26/macdoc
