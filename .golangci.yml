version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - gosec
    - misspell
    - errorlint
    - gocritic
    - unconvert
    - nolintlint
  settings:
    nolintlint:
      # Every //nolint must name the linter and say why, and must still be
      # needed.
      require-specific: true
      require-explanation: true
      allow-unused: false
  exclusions:
    rules:
      # Tests and test helpers build fixtures under t.TempDir() and run
      # fixed tools (bash for the guard-script tests): variable file paths
      # (G304), default 0o755/0o644 permissions (G301, G306) and exec with
      # a looked-up binary (G204) are intended there. Production code keeps
      # all of these checks.
      - path: (_test\.go$|^internal/testutil/)
        linters: [gosec]
        text: "^G(204|301|304|306):"
      # TEMPORARY: the read-only Runner must exec a caller-supplied argv
      # (fixed argv from recipes, no shell). This belongs as a targeted
      # `//nolint:gosec // G204: ...` on the exec.CommandContext line in
      # internal/platform/runner.go (tech-lead file, see .task/REPORT.md).
      # Remove this rule in the same change that adds that directive, or
      # nolintlint will flag the directive as unused.
      - path: ^internal/platform/runner\.go$
        linters: [gosec]
        text: "^G204:"
