version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - gosec
    - misspell
    - errorlint
    - gocritic
    - unconvert
    - nolintlint
  settings:
    misspell:
      locale: US
    nolintlint:
      # Every //nolint must name the linter and say why, and must still be
      # needed.
      require-specific: true
      require-explanation: true
      allow-unused: false
  exclusions:
    rules:
      # Tests and test helpers build fixtures under t.TempDir() and run
      # fixed tools (bash for the guard-script tests): variable file paths
      # (G304), default 0o755/0o644 permissions (G301, G306) and exec with
      # a looked-up binary (G204) are intended there. Production code keeps
      # all of these checks.
      - path: (_test\.go$|^internal/testutil/)
        linters: [gosec]
        text: "^G(204|301|304|306):"

formatters:
  enable:
    - gofmt
